# naphthalene-transport v3.0.0 — E1-E4 error corrections applied
# v2 → v3 changes: see docs/v3_error_fixes.md
# Based on J. Chem. Phys. 127, 044506 (2007)

crystal:
  a: 8.098          # Å
  b: 5.953          # Å
  c: 8.652          # Å
  beta: 124.4       # degrees
  space_group: "P2_1/a"
  n_atoms: 36
  n_molecules: 2

vasp:
  encut: 520        # eV
  ediff: 1.0e-7
  ismear: 0
  sigma: 0.05
  lreal: ".FALSE."
  isym: 0
  module: "vasp/6.4.3-impi"
  kpoints: [4, 4, 4]

eph:
  delta_Q: 0.01     # sqrt(amu)*Angstrom
  freq_min: 30.0    # cm-1 (exclude acoustic)
  freq_max: 2800.0  # cm-1 (exclude pure C-H stretches)

slurm:
  partition: "CPU"
  dfpt_cores: 32
  dfpt_walltime: "24:00:00"
  eph_cores: 8
  eph_walltime: "00:30:00"
  eph_array_max_concurrent: 20

ref_data:
  table_I_HOMO:
    epsilon_0: -0.835
    t_a: -0.023
    t_b: -0.042
    t_c: -0.003
    t_ac: -0.001
    t_ab: 0.022
    t_abc: -0.005
  table_II_intermolecular_cm1: [58.8, 82.0, 108.5]
